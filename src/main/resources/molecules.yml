# Recognised when every atom's valence is satisfied AND the composition matches.
# Bond orders are forced correct by valence (e.g. O2 can only complete as a double bond).
# name + fact are player-facing (Hebrew); id/display/atoms/reward stay in Latin/English.
molecules:
  hydrogen_gas:
    name: "גז מימן"
    display: "H2"
    atoms: { H: 2 }
    fact: "המולקולה הקלה ביותר, והדלק של כוכבים וטילים."
  oxygen_gas:
    name: "גז חמצן"
    display: "O2"
    atoms: { O: 2 }
    fact: "מוחזק בקשר כפול - האוויר שאתם נושמים ומה שהאש צריכה."
  nitrogen_gas:
    name: "גז חנקן"
    display: "N2"
    atoms: { N: 2 }
    fact: "קשר משולש הופך אותו ליציב כל כך ש-78% מהאוויר פשוט יושבים שם בלי להגיב."
  water:
    name: "מים"
    display: "H2O"
    atoms: { H: 2, O: 1 }
    fact: "מתרחבים כשהם קופאים - לכן הקרח צף והדגים שורדים את החורף."
    reward: WATER_BUCKET
  carbon_dioxide:
    name: "פחמן דו-חמצני"
    display: "CO2"
    atoms: { C: 1, O: 2 }
    fact: "אתם נושפים אותו, הצמחים שואפים אותו, והוא מבעבע במשקאות מוגזים."
  methane:
    name: "מתאן"
    display: "CH4"
    atoms: { C: 1, H: 4 }
    fact: "גז טבעי - ויש ממנו אגמים שלמים על טיטאן, ירח של שבתאי."
  ammonia:
    name: "אמוניה"
    display: "NH3"
    atoms: { N: 1, H: 3 }
    fact: "כשהופכים אותה לדשן, היא מאכילה בערך חצי מאוכלוסיית כדור הארץ."
  hydrogen_chloride:
    name: "מימן כלורי"
    display: "HCl"
    atoms: { H: 1, Cl: 1 }
    fact: "כשממיסים אותו במים מקבלים את החומצה שבקיבה שלכם."
  salt:
    name: "מלח"
    display: "NaCl"
    atoms: { Na: 1, Cl: 1 }
    fact: "מתכת שמתפוצצת במים יחד עם גז רעל - שאתם מפזרים על הצ'יפס."
  glucose:
    name: "גלוקוז"
    display: "C6H12O6"
    atoms: { C: 6, H: 12, O: 6 }
    fact: "סוכר - מה שצמחים בונים מאור שמש, אוויר ומים. הכי קשה להרכבה!"
    reward: SUGAR
  chlorine_gas:
    name: "גז כלור"
    display: "Cl2"
    atoms: { Cl: 2 }
    fact: "גז חונק בצבע צהוב-ירוק - שני אטומי כלור חולקים קשר בודד."
