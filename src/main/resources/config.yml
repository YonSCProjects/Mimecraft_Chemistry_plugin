world: world

plot:
  size: 96
  gap: 8
  origin-x: 0
  origin-z: 0
  ground-y: 64
  per-row: 8

wall:
  offset-x: 8
  offset-y: 65
  offset-z: 4
  tile-spacing: 2

# Right-click one of these blocks to open the matching station.
stations:
  panning: COPPER_BLOCK
  air_separation: BLUE_ICE
  smelter: BLAST_FURNACE
  electrolysis: SEA_LANTERN
  reactor: FURNACE

# Friendly name + one-line hint shown on the floating label above each auto-built station.
station-info:
  panning:        { name: "עמדת ניפוי",        hint: "נפו מתכות טבעיות וגופרית" }
  air_separation: { name: "מגדל הפרדת אוויר",   hint: "הפיקו גזים מהאוויר" }
  smelter:        { name: "מתיך",               hint: "הפחמן הוא חומר מחזר - הוא חוטף את החמצן מהעפרה" }
  electrolysis:   { name: "מעבדת אלקטרוליזה",   hint: "האבן האדומה היא החשמל שמפצל את התרכובת" }
  reactor:        { name: "כור",                hint: "הגיבו מולקולות לתרכובות חדשות" }

# Each plot gets a row of station blocks built next to its wall so players can start solo.
# Offsets are relative to the plot corner (kiosk sits just in front of the periodic-table wall).
# stations: which methods still live on plots (empty list = all, the legacy layout).
# With shared regions active, only the reactor stays home.
kiosk:
  offset-x: 8
  offset-y: 1
  offset-z: 1
  spacing: 3
  stations: [reactor]

# Shared gathering zones are defined in regions.yml.
# flatten: true  -> /cc region build generates a flat themed platform
# flatten: false -> terrain is sculpted by hand; build places only nodes/stations/labels
# student-tp: may students use /cc region tp (the commute is boring, the regions are not)
regions:
  flatten: true
  student-tp: true

# The shared "helpers" sidebar, scored by assists (see WallRegisterListener).
assist-board:
  enabled: true
  title: "עוזרים מובילים"

# Watching a classmate extract an element you lack (within radius blocks) turns your wall tile
# yellow ("seen") and records the demonstrator - who is paid an assist when you reproduce the
# extraction yourself. 0 disables witnessing.
demo:
  radius: 8

# Helper status ranks by assists: tab-list prefix only, never material perks.
# visit-min-assists gates /cc visit (teleport to a classmate's plot to look and learn).
ranks:
  visit-min-assists: 8
  tiers:
    3:  { name: "עוזר/ת מעבדה", color: green }
    8:  { name: "לבורנט/ית",    color: aqua }
    15: { name: "כימאי/ת",      color: gold }
    25: { name: "פרופסור",      color: light_purple }

# Raw materials handed to a player the first time they join (and via /chemcraft kit).
# Keys are vanilla Material names; set enabled: false to turn kits off.
starter-kit:
  enabled: true
  items:
    OAK_LOG: 8
    RAW_GOLD: 1
    RAW_IRON: 2
    RAW_COPPER: 2
    SAND: 4
    RED_SAND: 2
    CALCITE: 2
    REDSTONE: 16
    BONE_MEAL: 2      # phosphate feedstock for smelt_phos (skeletons may not spawn on a peaceful server)
    IRON_PICKAXE: 1   # node drops are plugin-side, but tool tier still sets BREAK SPEED - raw-gold blocks dig slowly below iron
    STONE_SHOVEL: 1   # sand and gravel beds
    STONE_AXE: 1      # forest logs

atoms:
  base-model-data: 7000

molecules:
  base-model-data: 8000
