# group/period = position on the periodic table (drives the wall layout).
# valence = common number of bonds (used later by the molecule engine).
# family  = drives the tile colour when an element is discovered.
H:  { name: Hydrogen,  number: 1,  group: 1,  period: 1, family: nonmetal,        valence: 1, region: sea,        raw: water,          extraction: electrolysis,   fact: "Most abundant element in the universe - stars are made of it." }
He: { name: Helium,    number: 2,  group: 18, period: 1, family: noble,           valence: 0, region: gas,        raw: gas pocket,     extraction: captured,       fact: "Bonds with nothing, and is so light it escapes into space. Once it is gone, it is gone." }
Li: { name: Lithium,   number: 3,  group: 1,  period: 2, family: alkali,          valence: 1, region: mines,      raw: lithium ore,    extraction: electrolysis,   fact: "Lightest metal - it floats on water (then reacts). It powers your phone." }
Be: { name: Beryllium, number: 4,  group: 2,  period: 2, family: alkaline_earth,  valence: 2, region: mines,      raw: beryl ore,      extraction: electrolysis,   fact: "Emeralds and aquamarines are beryllium crystals." }
B:  { name: Boron,     number: 5,  group: 13, period: 2, family: metalloid,       valence: 3, region: quarry,     raw: borax,          extraction: smelt,          fact: "Makes heat-proof Pyrex glass." }
C:  { name: Carbon,    number: 6,  group: 14, period: 2, family: nonmetal,        valence: 4, region: forest,     raw: wood,           extraction: burn,           fact: "Diamond and pencil lead are the same element. It is the basis of all life." }
N:  { name: Nitrogen,  number: 7,  group: 15, period: 2, family: nonmetal,        valence: 3, region: air,        raw: air,            extraction: air_separation, fact: "78% of the air - and so unreactive it is why the air does not catch fire." }
O:  { name: Oxygen,    number: 8,  group: 16, period: 2, family: nonmetal,        valence: 2, region: air,        raw: air,            extraction: air_separation, fact: "21% of air. No fire or breathing without it - and plants make it." }
F:  { name: Fluorine,  number: 9,  group: 17, period: 2, family: halogen,         valence: 1, region: quarry,     raw: fluorite,       extraction: electrolysis,   fact: "The most reactive element of all - the fluoride that protects your teeth." }
Ne: { name: Neon,      number: 10, group: 18, period: 2, family: noble,           valence: 0, region: air,        raw: air,            extraction: air_separation, fact: "Noble gas - glows red-orange in signs and bonds with nothing." }
Na: { name: Sodium,    number: 11, group: 1,  period: 3, family: alkali,          valence: 1, region: salt_flats, raw: salt,           extraction: electrolysis,   fact: "Reacts violently in water - yet it is half of table salt." }
Mg: { name: Magnesium, number: 12, group: 2,  period: 3, family: alkaline_earth,  valence: 2, region: sea,        raw: seawater,       extraction: electrolysis,   fact: "Burns with a blinding white light, and sits at the heart of chlorophyll." }
Al: { name: Aluminium, number: 13, group: 13, period: 3, family: post_transition, valence: 3, region: mines,      raw: bauxite,        extraction: electrolysis,   fact: "Once more precious than gold - now the most common metal in Earth's crust." }
Si: { name: Silicon,   number: 14, group: 14, period: 3, family: metalloid,       valence: 4, region: desert,     raw: sand,           extraction: smelt,          fact: "Sand becomes glass and computer chips. 2nd most common element in the crust." }
P:  { name: Phosphorus,number: 15, group: 15, period: 3, family: nonmetal,        valence: 3, region: quarry,     raw: phosphate rock, extraction: smelt,          fact: "Glows in the dark. In matches, and in your DNA and bones." }
S:  { name: Sulfur,    number: 16, group: 16, period: 3, family: nonmetal,        valence: 2, region: volcano,    raw: native sulfur,  extraction: dig,            fact: "Yellow crystals at volcanoes, the rotten-egg smell, an ingredient of gunpowder." }
Cl: { name: Chlorine,  number: 17, group: 17, period: 3, family: halogen,         valence: 1, region: salt_flats, raw: salt,           extraction: electrolysis,   fact: "A WWI poison gas that now keeps pools safe - the other half of salt." }
Ar: { name: Argon,     number: 18, group: 18, period: 3, family: noble,           valence: 0, region: air,        raw: air,            extraction: air_separation, fact: "So lazy it is pumped into lightbulbs to stop the filament burning." }
K:  { name: Potassium, number: 19, group: 1,  period: 4, family: alkali,          valence: 1, region: mines,      raw: potash,         extraction: electrolysis,   fact: "Reacts even harder with water than sodium (lilac flame). It is in bananas." }
Ca: { name: Calcium,   number: 20, group: 2,  period: 4, family: alkaline_earth,  valence: 2, region: quarry,     raw: limestone,      extraction: electrolysis,   fact: "Your bones and teeth. Chalk, marble and seashells are all calcium." }
Fe: { name: Iron,      number: 26, group: 8,  period: 4, family: transition,      valence: 2, region: mines,      raw: iron ore,       extraction: smelt,          fact: "Started the Iron Age, makes your blood red, and Earth's core is mostly iron." }
Cu: { name: Copper,    number: 29, group: 11, period: 4, family: transition,      valence: 2, region: mines,      raw: copper ore,     extraction: smelt,          fact: "First metal people used. Turns green (Statue of Liberty) and carries electricity." }
Zn: { name: Zinc,      number: 30, group: 12, period: 4, family: transition,      valence: 2, region: mines,      raw: zinc ore,       extraction: smelt,          fact: "Coats steel to stop rust. Mixed with copper it makes brass." }
Ag: { name: Silver,    number: 47, group: 11, period: 5, family: transition,      valence: 1, region: mines,      raw: silver ore,     extraction: smelt,          fact: "Best electrical conductor of any metal. Kills bacteria, and tarnishes black." }
Au: { name: Gold,      number: 79, group: 11, period: 6, family: transition,      valence: 1, region: river,      raw: native gold,    extraction: panning,        fact: "So unreactive it shines forever. Every gold atom was forged in an exploding star." }
