plugins {
    id 'java'
}

group = 'com.agurim'
version = '0.1.0'

// Dual-target build: `gradle build` targets Paper 1.21.8 (Java 21, the current class server);
// `gradle build -Pmc=26.2` targets Paper 26.2 stable (Java 25, the next server) and names the
// jar ChemCraft-<version>-mc26.2.jar. plugin.yml's api-version is templated to match.
def mcTarget = (findProperty('mc') ?: '1.21').toString()
def is26 = mcTarget.startsWith('26')
def paperApi   = is26 ? 'io.papermc.paper:paper-api:26.2.build.87-stable'
                      : 'io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT'
def apiVersion = is26 ? '26.2' : '1.21'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(is26 ? 25 : 21)
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly paperApi
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.processResources {
    filteringCharset = 'UTF-8'
    inputs.property('apiVersion', apiVersion)
    filesMatching('plugin.yml') {
        expand('apiVersion': apiVersion)
    }
}
if (is26) {
    tasks.jar { archiveClassifier = 'mc26.2' }
}
