name: ChemCraft
version: 0.1.0
main: com.agurim.chemcraft.ChemCraftPlugin
api-version: '${apiVersion}'
description: Teaches chemistry basics through exploration and building.
commands:
  chemcraft:
    description: ChemCraft commands
    usage: /chemcraft guide | kit | tp | region | visit <name> | ask <question> | report | questions | whisper <player> <text> | give <sym> [n] | givemol <id> [n] | discover <sym> | reset | buildwall | reload
    aliases: [cc]
permissions:
  chemcraft.admin:
    description: Admin/debug ChemCraft commands (give, givemol, discover, reset, region build, reload)
    default: op
