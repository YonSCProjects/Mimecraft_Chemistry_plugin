# inputs/outputs: molecule ids, or "atom:C" for an element atom. All reactions are balanced.
# label + fact are player-facing (Hebrew); id/inputs/outputs/effect stay in Latin/English.
reactions:
  - { id: burn_hydrogen, label: "שריפת מימן",          inputs: { hydrogen_gas: 2, oxygen_gas: 1 }, outputs: { water: 2 },                       effect: explosion, fact: "מימן שנשרף בחמצן יוצר מים - התגובה שמרימה טילים." }
  - { id: burn_carbon,   label: "שריפת פחמן",          inputs: { "atom:C": 1, oxygen_gas: 1 },     outputs: { carbon_dioxide: 1 },              effect: fire,      fact: "שריפת פחמן נותנת פחמן דו-חמצני - אותו גז שאש או מדורה פולטת." }
  - { id: burn_methane,  label: "שריפת מתאן",          inputs: { methane: 1, oxygen_gas: 2 },      outputs: { carbon_dioxide: 1, water: 2 },    effect: fire,      fact: "גז טבעי נשרף לפחמן דו-חמצני ומים - זו הלהבה שעל הכיריים." }
  - { id: make_salt,     label: "שריפת נתרן בכלור",    inputs: { "atom:Na": 2, chlorine_gas: 1 },  outputs: { salt: 2 },                        effect: fire,      fact: "מתכת אלימה פוגשת גז רעל והופכת בשלווה למלח שולחן." }
  - { id: make_ammonia,  label: "תהליך הָבֶּר",          inputs: { nitrogen_gas: 1, hydrogen_gas: 3 }, outputs: { ammonia: 2 },                   effect: none,      fact: "חנקן + מימן -> אמוניה: התגובה שהדשן שלה מאכיל חצי מהעולם." }
