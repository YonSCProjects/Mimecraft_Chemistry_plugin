# Build a 2x2x2 cube of atoms and it crystallises into a real block.
# pattern: uniform (all one element) or checker (two elements alternating by corner).
# name + fact are player-facing (Hebrew); id/element(s)/result stay in Latin/English.
materials:
  diamond:      { pattern: uniform, element: C,  result: DIAMOND_BLOCK, name: "יהלום",       fact: "יהלום הוא פחמן טהור נעול בסריג נוקשה - החומר הטבעי הקשה ביותר." }
  iron_block:   { pattern: uniform, element: Fe, result: IRON_BLOCK,    name: "בלוק ברזל",     fact: "אטומי מתכת נצמדים יחד וחולקים ים של אלקטרונים - לכן מתכות מוליכות." }
  copper_block: { pattern: uniform, element: Cu, result: COPPER_BLOCK,  name: "בלוק נחושת",   fact: "סריג נחושת - הוא יוריק לאט בגשם, כמו פסל החירות." }
  gold_block:   { pattern: uniform, element: Au, result: GOLD_BLOCK,    name: "בלוק זהב",     fact: "סריג הזהב לעולם לא מתעמעם - לכן זהב עתיק עדיין נוצץ." }
  salt_crystal: { pattern: checker, elements: [Na, Cl], result: WHITE_CONCRETE, name: "גביש מלח", fact: "גביש מלח הוא נתרן וכלור הערוכים בקובייה שחוזרת על עצמה בלי סוף." }
