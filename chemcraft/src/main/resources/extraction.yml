# inputs: vanilla Material names, or "atom:C" for an atom input. {} means no input.
# outputs: element symbols -> count. icon: which element's colour/icon represents the recipe.
# label is player-facing (Hebrew); id/station/icon/Material names/symbols stay in Latin.
#
# Labelling rule: the label names the PROCESS and its real feedstock; the auto-generated
# "צריך:" line under it is the shopping list, and the two are allowed to differ (Minecraft has
# no borax, halite, fluorite, potash or spodumene item to charge for). What a label must never
# imply is that the redstone or the carbon *becomes* the element. The role of each is stated
# once, on the station's own floating label (config.yml -> station-info), instead of being
# repeated into all 16 smelter/electrolysis labels.
recipes:
  # --- Panning (native elements). Feedstocks come from the volcano / river gather nodes. ---
  - { id: pan_gold,      station: panning,        icon: Au, label: "ניפוי זהב מהנחל",           inputs: { RAW_GOLD: 1 },              outputs: { Au: 1 } }
  - { id: dig_sulfur,    station: panning,        icon: S,  label: "איסוף גופרית טבעית",         inputs: { GUNPOWDER: 1 },             outputs: { S: 1 } }
  - { id: pan_silver,    station: panning,        icon: Ag, label: "איסוף כסף טבעי",             inputs: { GRAVEL: 2 },                outputs: { Ag: 1 } }

  # --- Air separation. Redstone = the compression/cooling energy: air is free, cold is not. ---
  - { id: air_nitrogen,  station: air_separation, icon: N,  label: "הפרדת חנקן מהאוויר",         inputs: { REDSTONE: 1 },              outputs: { N: 1 } }
  - { id: air_oxygen,    station: air_separation, icon: O,  label: "הפרדת חמצן מהאוויר",         inputs: { REDSTONE: 1 },              outputs: { O: 1 } }
  - { id: air_argon,     station: air_separation, icon: Ar, label: "הפרדת ארגון מהאוויר",        inputs: { REDSTONE: 1 },              outputs: { Ar: 1 } }
  - { id: air_neon,      station: air_separation, icon: Ne, label: "הפרדת ניאון מהאוויר",        inputs: { REDSTONE: 1 },              outputs: { Ne: 1 } }
  # He really comes from underground gas wells - it is too rare in air to be worth separating.
  - { id: air_helium,    station: air_separation, icon: He, label: "לכידת הליום מבארות גז",      inputs: { REDSTONE: 1 },              outputs: { He: 1 } }

  # --- Smelter (ore + carbon as the reducing agent). Carbon itself comes from charring wood. ---
  - { id: smelt_carbon,  station: smelter,        icon: C,  label: "פחום עץ ללא אוויר",          inputs: { OAK_LOG: 1 },               outputs: { C: 1 } }
  - { id: smelt_iron,    station: smelter,        icon: Fe, label: "התכת עפרת ברזל",             inputs: { RAW_IRON: 1, "atom:C": 1 }, outputs: { Fe: 1 } }
  - { id: smelt_copper,  station: smelter,        icon: Cu, label: "התכת עפרת נחושת",            inputs: { RAW_COPPER: 1, "atom:C": 1 }, outputs: { Cu: 1 } }
  - { id: smelt_silicon, station: smelter,        icon: Si, label: "התכת חול לצורן",             inputs: { SAND: 1, "atom:C": 1 },     outputs: { Si: 1 } }
  - { id: smelt_zinc,    station: smelter,        icon: Zn, label: "התכת עפרת אבץ",              inputs: { "atom:C": 1 },              outputs: { Zn: 1 } }
  # Reducing borax with carbon really yields boron carbide, so this label does not claim it does.
  - { id: smelt_boron,   station: smelter,        icon: B,  label: "הפקת בורון מבורקס",          inputs: { "atom:C": 1 },              outputs: { B: 1 } }
  # Bone ash is Ca3(PO4)2 - the historical phosphorus feedstock, and BONE_MEAL is its exact analogue.
  - { id: smelt_phos,    station: smelter,        icon: P,  label: "התכת פוספט מאבקת עצמות",     inputs: { BONE_MEAL: 1, "atom:C": 1 }, outputs: { P: 1 } }

  # --- Electrolysis (redstone = the electricity). Splits compounds. ---
  - { id: elec_water,    station: electrolysis,   icon: O,  label: "אלקטרוליזה של מים",          inputs: { REDSTONE: 1 },              outputs: { H: 2, O: 1 } }
  - { id: elec_salt,     station: electrolysis,   icon: Cl, label: "אלקטרוליזה של מלח מותך",     inputs: { REDSTONE: 1 },              outputs: { Na: 1, Cl: 1 } }
  - { id: elec_aluminium,station: electrolysis,   icon: Al, label: "הפקת אלומיניום מבוקסיט",     inputs: { RED_SAND: 1, REDSTONE: 1 }, outputs: { Al: 1 } }
  - { id: elec_calcium,  station: electrolysis,   icon: Ca, label: "הפקת סידן מאבן גיר",         inputs: { CALCITE: 1, REDSTONE: 1 },  outputs: { Ca: 1 } }
  - { id: elec_magnesium,station: electrolysis,   icon: Mg, label: "הפקת מגנזיום ממי ים",        inputs: { REDSTONE: 1 },              outputs: { Mg: 1 } }
  - { id: elec_potassium,station: electrolysis,   icon: K,  label: "הפקת אשלגן מאשלג",           inputs: { REDSTONE: 1 },              outputs: { K: 1 } }
  - { id: elec_lithium,  station: electrolysis,   icon: Li, label: "הפקת ליתיום ממי מלח",        inputs: { REDSTONE: 1 },              outputs: { Li: 1 } }
  - { id: elec_beryllium,station: electrolysis,   icon: Be, label: "הפקת בריליום מבריל",         inputs: { REDSTONE: 1 },              outputs: { Be: 1 } }
  - { id: elec_fluorine, station: electrolysis,   icon: F,  label: "הפקת פלואור מפלואוריט",      inputs: { REDSTONE: 1 },              outputs: { F: 1 } }
