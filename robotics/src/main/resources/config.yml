world: world

plot:
  size: 96
  gap: 8
  origin-x: 0
  origin-z: 0
  ground-y: 64
  per-row: 8

# The Component Board: a per-plot ghost->lit wall, one tile per part (see parts.yml).
# Same idea as ChemCraft's periodic-table wall - it answers "what can I build with?" and
# "what am I working towards?" in one glance.
board:
  offset-x: 8
  offset-y: 65
  offset-z: 4
  tile-spacing: 2
  per-row: 6

# The workbench row built next to each plot's board so a student can start with no op setup.
kiosk:
  offset-x: 8
  offset-y: 1
  offset-z: 1
  spacing: 3

# The sense -> decide -> act loop.
# tick-interval is in server ticks: 10 = twice a second. Slower is easier to watch and cheaper;
# faster feels more responsive. 10 is the sweet spot for a classroom.
# attach-radius: how far from the controller a part may sit and still join that robot.
robot:
  tick-interval: 10
  attach-radius: 4
  max-parts: 16
  # Robots stop when their owner is offline; nothing should tick for an empty plot.
  require-owner-online: true

program:
  # Five rules fit one GUI page and force economical thinking. Raising this past 5 needs a
  # paged GUI - ProgramMenu lays out one rule per row in a 6-row chest.
  max-rules: 5
  memory-slots: 4

# Energy. Every active actuator costs; sensors cost a little; idle costs almost nothing.
# This is what makes "your robot works but dies in 40 seconds" a real design problem, and
# duty-cycling (sleep between checks) the real fix.
power:
  enabled: true
  base-drain: 1          # per tick, just for being switched on
  sensor-drain: 1        # per attached sensor per tick
  solar-gain: 2          # per solar panel per tick, scaled by light level
  # Charger block on the plot kiosk refills any robot within this radius. Charging is manual on
  # purpose: an energy budget you can top up without thinking is not a budget.
  # Must be a block that never changes state on its own - waxed copper, never plain.
  charger-block: WAXED_CHISELED_COPPER
  # 14, not 6. The pad sits at the plot corner and JoinListener lands a student ELEVEN blocks away,
  # in front of the board - which is exactly where they then build. At 6 a robot built where the
  # game invited you to build could not reach its own charger, and clicking the pad did nothing
  # with no explanation. Found by playtest. Raise the radius AND say why a click missed; either
  # alone leaves a student stuck or walking their robot around the plot.
  charger-radius: 14
  charger-rate: 60

missions:
  enabled: true
  # The test bench injects simulated sensor inputs rather than changing the shared world.
  # See docs/DESIGN.md 4.4 - forcing real night would black out the whole class, setPlayerTime
  # is client-side only so block light would not move anyway, and a real day/night cycle is
  # ten minutes against the bench's fifteen seconds.
  bench-narrate: true
  # Never a score, always the failing check, unlimited retries.
  show-failed-check: true

# The in-game assistant voice.
#
# The plugin never talks to an AI. Students ask with `/rc ask <question>`; the plugin CAPTURES the
# question together with the state needed to answer it - the student's actual rule table, what each
# sensor is reading, which rule fired last, and the bench check they most recently failed - into
# questions.jsonl. An external agent tails that file and replies with `/rc whisper`, which is
# needed because on 26.2 the console tell/tellraw/msg deliver nothing at all.
#
# So the answering agent is external, swappable and optional: no keys or model choice in the
# plugin, and the questions stand on their own as a teaching record even with no assistant running.
# `/rc questions` shows what the class is stuck on.
assistant:
  name: "עוזר/ת סדנה"
  sound: true
  cooldown-seconds: 15

# A per-player bossbar carrying the current mission and the robot's battery.
# While a student is still on the warm-ups the bar counts warm-ups instead, in a different colour -
# otherwise their first success moves nothing at all, because progress counts the required ladder
# only and a warm-up unlocks no part.
status-bar:
  enabled: true

# What happens the first time a student passes a mission.
#
# Completion used to be a title, a sound and one chat line, all gone within seconds - and for the
# three warm-ups nothing else moved either. Students finished their first mission and found the
# world exactly as they had left it. These are the loud half of the fix; the trophy shelf below is
# the permanent half.
#
# First completion only. Re-running a passed mission is how you check a change, and it must not
# re-announce, or the class chat turns to noise.
celebrate:
  enabled: true
  fireworks: true
  # One line to the whole class. The cheapest motivation here by a distance: public recognition
  # that costs no part, no gear and no gate.
  broadcast: true

# A grid of trophies BESIDE the Component Board - one slot per mission, dark glass until earned,
# then iron for a warm-up and gold for a rung of the required ladder. Permanent, visible to
# visitors, and grants nothing whatsoever.
#
# It started above the board and that was wrong twice over: the first person to stand on a plot
# never saw it, because it was above eye level - and once told where to look, said it "looks like
# part of the wall", because an empty slot was the same grey glass as a locked board tile. Now it
# sits at the board's own height, a clear gap to its right, in a block the wall never uses.
#
# Its position is derived from the board's layout, NOT set absolutely: a bundled default is only
# copied to a server that has no config.yml yet, so a fixed X or Y would be wrong on every server
# already running (the class servers use board.offset-y: -60 against a shipped default of 65).
trophies:
  enabled: true
  spacing: 2
  # 8 missions over 4 columns = two rows, both at eye level.
  per-row: 4
  # Blocks of empty wall between the board's right-hand edge and the first trophy.
  gap: 3

# What happens when a student touches someone else's plot. The attempt ALWAYS fails; this only
# shapes how failing feels. Deliberately undramatic - see ChemCraft's plot shield.
plot-shield:
  enabled: true
  particles: true
  escalate-after: 4
  window-seconds: 30

# Parts handed out the first time a player joins (and via /rc kit). Keys are parts.yml ids.
starter-kit:
  enabled: true
  parts:
    controller: 1
    battery: 1
    light_sensor: 1
    lamp: 1

parts:
  base-model-data: 9000
