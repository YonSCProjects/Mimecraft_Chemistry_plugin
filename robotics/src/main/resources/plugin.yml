name: RoboCraft
version: 0.1.0
main: com.agurim.robocraft.RoboCraftPlugin
api-version: '${apiVersion}'
description: Teaches robotics - sense, decide, act - by building mechanisms and running missions.
commands:
  robocraft:
    description: RoboCraft commands
    usage: /robocraft guide | kit | tp | board | missions | mission <id> | run | stop | trace | charge | ask <question> | give <part> [n] | unlock <part> | reset | reload | selftest | progress | questions | whisper | pause [player] [text] | resume [player] | say [player] <text>
    aliases: [rc]
permissions:
  robocraft.admin:
    description: Teacher/admin RoboCraft commands (pause, resume, say, progress, questions, give, unlock, reset, reload, selftest)
    default: op
